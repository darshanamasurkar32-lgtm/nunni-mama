<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Nikhil's Story - Stickman</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f0f14;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
    }
    #gameWrapper {
      position: relative;
      border: 3px solid #444;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    canvas { display: block; }
    .controls-panel {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .btn {
      background: #252836;
      color: #fff;
      border: 2px solid #555;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn:active { background: #3b3f54; transform: scale(0.96); }
    .btn-action {
      background: #e91e63;
      border-color: #ff6090;
    }
    .status-bar {
      margin-top: 10px;
      color: #ffd54f;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="gameWrapper">
    <canvas id="canvas" width="850" height="420"></canvas>
  </div>

  <div class="controls-panel">
    <button class="btn" id="btnLeft">⬅️ LEFT (A)</button>
    <button class="btn btn-action" id="btnAction">⚡ ACTION (SPACE / E)</button>
    <button class="btn" id="btnRight">➡️ RIGHT (D)</button>
  </div>

  <div class="status-bar" id="statusText">Keyboard: A/D ya Arrows se chalo, SPACE ya E se Action lo.</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');

    const input = { left: false, right: false, action: false };

    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'KeyA', 'a', 'A'].includes(e.key) || ['ArrowLeft', 'KeyA'].includes(e.code)) input.left = true;
      if (['ArrowRight', 'KeyD', 'd', 'D'].includes(e.key) || ['ArrowRight', 'KeyD'].includes(e.code)) input.right = true;
      if ([' ', 'Space', 'KeyE', 'e', 'E', 'Enter'].includes(e.key) || ['Space', 'KeyE', 'Enter'].includes(e.code)) {
        input.action = true;
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'KeyA', 'a', 'A'].includes(e.key) || ['ArrowLeft', 'KeyA'].includes(e.code)) input.left = false;
      if (['ArrowRight', 'KeyD', 'd', 'D'].includes(e.key) || ['ArrowRight', 'KeyD'].includes(e.code)) input.right = false;
      if ([' ', 'Space', 'KeyE', 'e', 'E', 'Enter'].includes(e.key) || ['Space', 'KeyE', 'Enter'].includes(e.code)) input.action = false;
    });

    const btnL = document.getElementById('btnLeft');
    const btnR = document.getElementById('btnRight');
    const btnA = document.getElementById('btnAction');

    const bindHold = (btn, keyName) => {
      btn.addEventListener('mousedown', () => input[keyName] = true);
      btn.addEventListener('mouseup', () => input[keyName] = false);
      btn.addEventListener('mouseleave', () => input[keyName] = false);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); input[keyName] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); input[keyName] = false; });
    };

    bindHold(btnL, 'left');
    bindHold(btnR, 'right');

    btnA.addEventListener('mousedown', () => { input.action = true; setTimeout(() => input.action = false, 150); });
    btnA.addEventListener('touchstart', (e) => { e.preventDefault(); input.action = true; setTimeout(() => input.action = false, 150); });

    let step = 0;
    let timer = 0;

    const groundY = 340;

    // Nikhil start point
    const nikhil = {
      x: 150,
      y: groundY,
      speed: 3.5,
      walkFrame: 0,
      isMoving: false,
      dir: 1
    };

    // Simran position
    const simran = {
      x: 680,
      y: groundY
    };

    // CIGARETTE SPOT FIXED: Screen ke andar (220px) taaki bilkul saaf dikhe
    const smokingSpotX = 220;
    let particles = [];

    function drawStickman(x, y, name, color, isFemale, pose, dir) {
      ctx.save();
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;

      // Name over head
      ctx.font = "bold 15px sans-serif";
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffffff";
      ctx.fillText(name, x, y - 82);
      ctx.fillStyle = color;

      // Head
      ctx.beginPath();
      ctx.arc(x, y - 62, 12, 0, Math.PI * 2);
      ctx.stroke();

      if (isFemale) {
        ctx.beginPath();
        ctx.moveTo(x - 10, y - 68);
        ctx.lineTo(x - 14, y - 45);
        ctx.moveTo(x + 10, y - 68);
        ctx.lineTo(x + 14, y - 45);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, y - 35);
        ctx.lineTo(x - 14, y - 18);
        ctx.lineTo(x + 14, y - 18);
        ctx.closePath();
        ctx.fill();
      }

      // Torso
      ctx.beginPath();
      ctx.moveTo(x, y - 50);
      ctx.lineTo(x, y - 22);
      ctx.stroke();

      const swing = Math.sin(nikhil.walkFrame) * 11;

      if (pose === 'idle') {
        ctx.beginPath();
        ctx.moveTo(x, y - 22);
        ctx.lineTo(x - 8, y);
        ctx.moveTo(x, y - 22);
        ctx.lineTo(x + 8, y);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, y - 45);
        ctx.lineTo(x - 10, y - 28);
        ctx.moveTo(x, y - 45);
        ctx.lineTo(x + 10, y - 28);
        ctx.stroke();
      }
      else if (pose === 'walk') {
        ctx.beginPath();
        ctx.moveTo(x, y - 22);
        ctx.lineTo(x - swing, y);
        ctx.moveTo(x, y - 22);
        ctx.lineTo(x + swing, y);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, y - 45);
        ctx.lineTo(x + swing, y - 28);
        ctx.moveTo(x, y - 45);
        ctx.lineTo(x - swing, y - 28);
        ctx.stroke();
      }
      else if (pose === 'propose') {
        ctx.beginPath();
        ctx.moveTo(x, y - 22);
        ctx.lineTo(x - 12, y - 8);
        ctx.lineTo(x - 14, y);
        ctx.moveTo(x, y - 22);
        ctx.lineTo(x + 10, y);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, y - 45);
        ctx.lineTo(x + 20, y - 42);
        ctx.stroke();

        ctx.fillStyle = '#ff1744';
        ctx.beginPath();
        ctx.arc(x + 23, y - 44, 5, 0, Math.PI * 2);
        ctx.fill();
      }
      else if (pose === 'smoke') {
        ctx.beginPath();
        ctx.moveTo(x, y - 22);
        ctx.lineTo(x - 6, y);
        ctx.moveTo(x, y - 22);
        ctx.lineTo(x + 6, y);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, y - 45);
        ctx.lineTo(x + (8 * dir), y - 55);
        ctx.lineTo(x + (13 * dir), y - 61);
        ctx.stroke();

        // Cigarette Stick
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + (13 * dir), y - 61);
        ctx.lineTo(x + (20 * dir), y - 63);
        ctx.stroke();

        // Glowing red tip
        ctx.fillStyle = '#ff3d00';
        ctx.beginPath();
        ctx.arc(x + (20 * dir), y - 63, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawBubble(x, y, text, isReject = false) {
      ctx.save();
      ctx.font = "bold 13px sans-serif";
      const w = ctx.measureText(text).width + 22;
      const h = 28;
      const bx = x - w / 2;
      const by = y - h - 18;

      ctx.fillStyle = isReject ? '#ffebee' : '#ffffff';
      ctx.strokeStyle = isReject ? '#d32f2f' : '#222';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.roundRect(bx, by, w, h, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = isReject ? '#c62828' : '#111';
      ctx.textAlign = 'center';
      ctx.fillText(text, x, by + 18);
      ctx.restore();
    }

    function update() {
      // 0: Walk to Simran
      if (step === 0) {
        nikhil.isMoving = false;
        if (input.right && nikhil.x < simran.x - 70) {
          nikhil.x += nikhil.speed;
          nikhil.dir = 1;
          nikhil.walkFrame += 0.2;
          nikhil.isMoving = true;
        }
        if (input.left && nikhil.x > 60) {
          nikhil.x -= nikhil.speed;
          nikhil.dir = -1;
          nikhil.walkFrame += 0.2;
          nikhil.isMoving = true;
        }

        if (nikhil.x >= simran.x - 75) {
          statusText.innerText = "Ab ACTION button (SPACE / E) dabao propose karne ke liye! ❤️";
          if (input.action) {
            step = 1;
            timer = 0;
            input.action = false;
          }
        } else {
          statusText.innerText = "Nikhil ko RIGHT le jao Simran ke paas ➡️";
        }
      }

      // 1: Proposing
      else if (step === 1) {
        timer++;
        statusText.innerText = "Nikhil propose kar raha hai...";
        if (timer > 120) {
          step = 2;
          timer = 0;
          for (let i = 0; i < 8; i++) {
            particles.push({
              x: nikhil.x + (Math.random() * 20 - 10),
              y: nikhil.y - 70,
              vx: (Math.random() - 0.5) * 1.5,
              vy: -1.5 - Math.random() * 1.5,
              type: 'sad',
              alpha: 1
            });
          }
        }
      }

      // 2: Rejection -> Move to Smoking spot (Screen ke andar hi rahega)
      else if (step === 2) {
        timer++;
        if (timer > 80) {
          statusText.innerText = "Dil toot gaya! Nikhil ko Bench & Lamp ke paas le jao ⬅️";
          nikhil.isMoving = false;

          // HARD BOUNDARY: Nikhil 210 se peeche nahi jayega (Screen ke bahar jana impossible)
          if (input.left && nikhil.x > smokingSpotX) {
            nikhil.x -= nikhil.speed;
            nikhil.dir = -1;
            nikhil.walkFrame += 0.2;
            nikhil.isMoving = true;
          }
          if (input.right && nikhil.x < 450) {
            nikhil.x += nikhil.speed;
            nikhil.dir = 1;
            nikhil.walkFrame += 0.2;
            nikhil.isMoving = true;
          }

          if (Math.random() < 0.04) {
            particles.push({
              x: nikhil.x,
              y: nikhil.y - 70,
              vx: (Math.random() - 0.5),
              vy: -1.2,
              type: 'sad',
              alpha: 1
            });
          }

          // Arrived at spot
          if (Math.abs(nikhil.x - smokingSpotX) <= 15) {
            statusText.innerText = "Bench aa gaya! ACTION button dabao cigarette pine ke liye 🚬";
            if (input.action) {
              step = 3;
              timer = 0;
              nikhil.x = smokingSpotX; // Lock exactly in front of bench
              nikhil.dir = 1; // Face towards right/front
              input.action = false;
            }
          }
        }
      }

      // 3: Smoking Animation
      else if (step === 3) {
        timer++;
        statusText.innerText = "Nikhil ghum me cigarette pi raha hai... 🚬";
        if (timer % 4 === 0) {
          particles.push({
            x: nikhil.x + 20,
            y: nikhil.y - 63,
            vx: 0.3 + Math.random() * 0.4,
            vy: -1 - Math.random(),
            size: 2.5,
            type: 'smoke',
            alpha: 0.8
          });
        }
        if (timer > 200) {
          step = 4;
          timer = 0;
        }
      }

      // 4: Crying & Ending Screen
      else if (step === 4) {
        timer++;
        statusText.innerText = "Nikhil rote hue toot gaya... 😭";
        particles.push({
          x: nikhil.x + 5,
          y: nikhil.y - 62,
          vx: (Math.random() - 0.5) * 0.4,
          vy: 2 + Math.random() * 1.5,
          type: 'tear',
          alpha: 1
        });
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.type === 'smoke') {
          p.size += 0.1;
          p.alpha -= 0.012;
        } else if (p.type === 'sad') {
          p.alpha -= 0.015;
        } else if (p.type === 'tear') {
          p.alpha -= 0.02;
        }
        if (p.alpha <= 0 || p.y >= groundY) particles.splice(i, 1);
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sky
      let sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      if (step < 2) {
        sky.addColorStop(0, '#3a7bd5');
        sky.addColorStop(1, '#ffd194');
      } else {
        sky.addColorStop(0, '#0f172a');
        sky.addColorStop(1, '#1e1b4b');
      }
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ground
      ctx.fillStyle = step < 2 ? '#2e7d32' : '#142918';
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
      ctx.fillStyle = '#111';
      ctx.fillRect(0, groundY, canvas.width, 3);

      // Lamp Post (Shifted inward: X = 180)
      ctx.strokeStyle = '#666';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(180, groundY);
      ctx.lineTo(180, 220);
      ctx.lineTo(220, 220);
      ctx.stroke();

      // Lamp Light Cone
      if (step >= 2) {
        let cone = ctx.createRadialGradient(220, 225, 5, 220, 290, 100);
        cone.addColorStop(0, 'rgba(255, 235, 59, 0.5)');
        cone.addColorStop(1, 'rgba(255, 235, 59, 0)');
        ctx.fillStyle = cone;
        ctx.beginPath();
        ctx.moveTo(220, 225);
        ctx.lineTo(150, groundY);
        ctx.lineTo(290, groundY);
        ctx.closePath();
        ctx.fill();
      }

      // Bench (Shifted inward: X = 195 to 255)
      ctx.strokeStyle = '#5d4037';
      ctx.lineWidth = 4;
      ctx.strokeRect(195, groundY - 18, 55, 18);

      // Simran
      drawStickman(simran.x, simran.y, "Simran", "#ff4081", true, "idle", -1);

      // Nikhil Poses
      let pose = 'idle';
      if (step === 0 || step === 2) pose = nikhil.isMoving ? 'walk' : 'idle';
      else if (step === 1) pose = 'propose';
      else if (step >= 3) pose = 'smoke';

      drawStickman(nikhil.x, nikhil.y, "Nikhil", "#00e5ff", false, pose, nikhil.dir);

      // Render Particles
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        if (p.type === 'sad') {
          ctx.font = '22px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('💔', p.x, p.y);
        } else if (p.type === 'smoke') {
          ctx.fillStyle = '#bbb';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.type === 'tear') {
          ctx.fillStyle = '#00e5ff';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });

      // Dialogues
      if (step === 0 && nikhil.x >= simran.x - 75) {
        drawBubble(nikhil.x, nikhil.y - 75, "Press ACTION to Propose ❤️");
      } else if (step === 1) {
        drawBubble(nikhil.x, nikhil.y - 75, "I Love You Simran! 🌹");
      } else if (step === 2) {
        if (timer <= 80) {
          drawBubble(simran.x, simran.y - 75, "Sorry Nikhil, You are just a friend! ❌", true);
        } else if (Math.abs(nikhil.x - smokingSpotX) <= 15) {
          drawBubble(nikhil.x, nikhil.y - 75, "Press ACTION to Light Cigarette 🚬");
        } else {
          drawBubble(nikhil.x, nikhil.y - 75, "Mera dil tod diya... 💔");
        }
      } else if (step === 3) {
        drawBubble(nikhil.x, nikhil.y - 75, "Kaash wo meri hoti... 🚬");
      }

      // End Screen
      if (step === 4) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ff1744';
        ctx.font = 'bold 34px sans-serif';
        ctx.fillText("💔 DIL TOOT GAYA...", canvas.width / 2, 170);

        ctx.fillStyle = '#ffffff';
        ctx.font = '20px sans-serif';
        ctx.fillText("Nikhil rote rote cigarette pita reh gaya 😭🚬", canvas.width / 2, 215);

        ctx.fillStyle = '#ffd54f';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText("--- GAME END ---", canvas.width / 2, 265);
      }
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
